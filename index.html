    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --section-bg: #151515;
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --accent-color: #6366f1;
            --color-amber: #f59e0b;
            --color-emerald: #10b981;
            --color-red: #ef4444;
            --color-purple: #8b5cf6;
            --color-cyan: #06b6d4;
            --mono-color: #a5f3fc;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            
            --demo-indigo: #6366f1;
            --demo-amber: #f59e0b;
            --demo-emerald: #10b981;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-areas: 
                "top-bar top-bar"
                "sidebar main"
                "sidebar footer";
            grid-template-rows: 60px 1fr auto;
            grid-template-columns: 280px 1fr;
        }

        #top-bar {
            grid-area: top-bar;
            background-color: var(--section-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 10;
            gap: 2rem;
        }

        #top-bar h1 {
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        #search-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent-color);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .tabs-container {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: none;
        }

        .tab:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }

        #sidebar {
            grid-area: sidebar;
            background-color: var(--section-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1rem 0;
        }

        .nav-link {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            border-left-color: var(--accent-color);
        }

        #main {
            grid-area: main;
            background-color: var(--bg-color);
            overflow-y: auto;
            padding: 0 2rem 2rem 2rem;
        }

        section {
            padding-top: 2rem;
            margin-bottom: 2rem;
        }

        section h2 {
            position: sticky;
            top: 0;
            background-color: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            z-index: 5;
            font-size: 1.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .property-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .property-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            background-color: rgba(99, 102, 241, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            align-self: flex-start;
            transition: all 0.2s;
            border: none;
            outline: none;
        }

        .property-title:hover, .property-title:focus {
            background-color: rgba(99, 102, 241, 0.2);
            color: #fff;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .property-note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            border-left: 2px solid var(--accent-color);
            line-height: 1.4;
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .property-note svg {
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--accent-color);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .demo-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .demo-container {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 100px;
            position: relative;
            overflow: hidden;
            padding: 8px;
            cursor: help;
        }

        .demo-item {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .demo-item:nth-child(1) { background-color: var(--demo-indigo); }
        .demo-item:nth-child(2) { background-color: var(--demo-amber); }
        .demo-item:nth-child(3) { background-color: var(--demo-emerald); }

        .demo-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: none;
            border: none;
            cursor: pointer;
            width: 100%;
            display: block;
            padding: 2px 0;
            outline: none;
            transition: color 0.2s;
        }

        .demo-label:hover, .demo-label:focus {
            color: var(--text-primary);
            text-decoration: underline;
        }

        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background-color: #1e1e1e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            white-space: pre;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        [data-tooltip]:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        /* Basic dark theme scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* Callout Boxes */
        .callout-box {
            padding: 1rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.5;
            background-color: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--border-color);
        }

        .callout-tip {
            border-left-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .callout-gotcha {
            border-left-color: var(--demo-amber);
            background-color: rgba(245, 158, 11, 0.05);
        }

        .callout-pattern {
            border-left-color: var(--demo-emerald);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .pattern-card .demo-container {
            height: 140px;
            background-color: #000;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Mobile Hamburger */
        #menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 0.5rem;
            margin-left: -0.5rem;
            z-index: 110;
        }

        /* Ad Slots */
        .ad-slot {
            border: 1px dashed var(--border-color);
            background-color: rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 12px;
            margin: 1.5rem auto;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            overflow: hidden;
            flex-shrink: 0;
        }

        #ad-top-bar { margin: 0 1rem; }
        #ad-mobile-bottom {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background-color: var(--bg-color);
            margin: 0;
            border-bottom: none;
        }

        /* Responsive Layout */
        @media (max-width: 1024px) {
            body {
                grid-template-areas: 
                    "top-bar"
                    "main";
                grid-template-columns: 1fr;
            }

            #menu-toggle {
                display: block;
            }

            #top-bar {
                padding: 0 1rem;
                gap: 1rem;
            }

            #top-bar h1 {
                font-size: 1rem;
            }

            .search-container {
                max-width: none;
            }

            .tabs-container {
                display: none; /* Hide tabs on very small screens or move to drawer? Let's hide for now as per simple mobile nav */
            }

            #sidebar {
                position: fixed;
                top: 60px;
                left: -280px;
                width: 280px;
                height: calc(100vh - 60px);
                z-index: 100;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 20px 0 25px -5px rgba(0, 0, 0, 0.5);
            }

            #sidebar.open {
                left: 0;
            }

            #main {
                padding: 0 1rem 1rem 1rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .ad-slot[data-desktop-only="true"] {
                display: none !important;
            }

            /* Overlay when sidebar open */
            .sidebar-overlay {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(2px);
                z-index: 90;
                display: none;
            }
            .sidebar-overlay.visible {
                display: block;
            }

            body.lock-scroll {
                overflow: hidden;
            }
        }

        @media (min-width: 1025px) {
            .ad-slot[data-mobile-only="true"] {
                display: none !important;
            }
        }

        /* OS Toggle & Print Button */
        .os-toggle {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
            margin-left: auto;
        }

        .os-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .os-btn.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .top-bar-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .top-bar-btn:hover {
            opacity: 0.9;
        }

        /* Footer */
        #app-footer {
            grid-area: footer;
            background-color: var(--section-bg);
            border-top: 1px solid var(--border-color);
            padding: 1rem 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            z-index: 10;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .footer-links a, .footer-print-btn {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: var(--font-main);
        }

        .footer-links a:hover, .footer-print-btn:hover {
            color: var(--accent-color);
        }

        mark {
            background: rgba(99, 102, 241, 0.35);
            color: var(--text-primary);
            border-radius: 2px;
            padding: 0 2px;
        }

        .github-link {
            display: flex;
            align-items: center;
        }

        @media (max-width: 1024px) {
            #app-footer {
                padding: 1rem;
            }
            .footer-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }

        @media print {
            body {
                background-color: white !important;
                color: black !important;
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }
            #sidebar, #top-bar, #app-footer, #menu-toggle, .ad-slot, .sidebar-overlay, #ad-mobile-bottom, [data-tooltip]::after {
                display: none !important;
            }
            #main {
                grid-area: auto !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            section {
                padding-top: 1rem !important;
                margin-bottom: 2rem !important;
            }
            section h2 {
                position: static !important;
                background-color: white !important;
                color: black !important;
                border-bottom: 2px solid black !important;
                padding: 0.5rem 0 !important;
            }
            .card-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 1.5rem !important;
            }
            .property-card {
                background-color: white !important;
                border: 1px solid #eee !important;
                break-inside: avoid;
                page-break-inside: avoid;
                color: black !important;
            }
            .property-title {
                background-color: #f3f4f6 !important;
                color: black !important;
                border: 1px solid #ddd !important;
            }
            .demo-container {
                background-color: white !important;
                border: 1px solid black !important;
            }
            .demo-item {
                background-color: transparent !important;
                outline: 1px solid black !important;
            }
            .callout-box {
                background-color: #f9fafb !important;
                border: 1px solid #eee !important;
                border-left-width: 4px !important;
                color: black !important;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <header id="top-bar">
        <button id="menu-toggle" aria-label="Toggle navigation menu" aria-controls="sidebar" aria-expanded="false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

    <script>
        const FALLBACK_CATALOG = {
            product: {
                name: "Flex & Grid Vault",
                tagline: "The visual CSS reference you actually keep open."
            },
            sections: [
                { id: "flex-container-properties", title: "Flexbox Container Properties", filter: "flexbox" },
                { id: "flex-item-properties", title: "Flexbox Item Properties", filter: "flexbox" },
                { id: "grid-container-properties", title: "Grid Container Properties", filter: "grid" },
                { id: "grid-item-properties", title: "Grid Item Properties", filter: "grid" },
                { id: "quick-patterns", title: "Quick Patterns", filter: "patterns" }
            ],
            properties: [
                {
                    id: "display-flex-grid",
                    name: "display",
                    layout: "both",
                    level: "container",
                    section: "flex-container-properties",
                    values: ["flex", "inline-flex", "grid", "inline-grid"]
                },
                {
                    id: "flex-direction",
                    name: "flex-direction",
                    layout: "flexbox",
                    level: "container",
                    section: "flex-container-properties",
                    values: ["row", "row-reverse", "column", "column-reverse"]
                },
                {
                    id: "flex-wrap",
                    name: "flex-wrap",
                    layout: "flexbox",
                    level: "container",
                    section: "flex-container-properties",
                    values: ["nowrap", "wrap", "wrap-reverse"]
                },
                {
                    id: "justify-content-flex",
                    name: "justify-content",
                    layout: "flexbox",
                    level: "container",
                    section: "flex-container-properties",
                    values: ["flex-start", "flex-end", "center", "space-between", "space-around", "space-evenly"]
                },
                {
                    id: "align-items-flex",
                    name: "align-items",
                    layout: "flexbox",
                    level: "container",
                    section: "flex-container-properties",
                    values: ["stretch", "flex-start", "flex-end", "center", "baseline"]
                },
                {
                    id: "align-content-flex",
                    name: "align-content",
                    layout: "flexbox",
                    level: "container",

        let CATALOG = FALLBACK_CATALOG;

        function setCopyFeedback(element, feedbackText, originalText) {
            element.textContent = feedbackText;
            setTimeout(() => {
                element.textContent = originalText;
            }, 1500);
        }

        function sendCopyTelemetry(text) {
            if (!window.location.protocol.startsWith('http')) {
                return;
            }

            fetch('/api/v1/telemetry/copy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: 'frontend', value: text }),
                keepalive: true
            }).catch(() => {});
        }

        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (_) {}
            document.body.removeChild(textarea);
            return success;
        }

        function copyToClipboard(text, element, feedbackText, originalText) {
            const onSuccess = () => {
                setCopyFeedback(element, feedbackText, originalText);
                sendCopyTelemetry(text);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    onSuccess();
                }).catch(() => {
                    if (fallbackCopyText(text)) {
                        onSuccess();
                    } else {
                        setCopyFeedback(element, "Copy failed", originalText);
                    }
                });
                return;
            }

            if (fallbackCopyText(text)) {
                onSuccess();
            } else {
                setCopyFeedback(element, "Copy failed", originalText);
            }
        }

        function applyMetaFromCatalog() {
            if (!CATALOG.meta) {
                return;
            }

            document.title = CATALOG.meta.title;
            const setAttr = (selector, attr, value) => {
                const node = document.querySelector(selector);
                if (node && value) {
                    node.setAttribute(attr, value);
                }
            };
            setAttr('link[rel="canonical"]', 'href', CATALOG.meta.canonical);
            setAttr('meta[property="og:url"]', 'content', CATALOG.meta.og && CATALOG.meta.og.url);
            setAttr('meta[property="og:title"]', 'content', CATALOG.meta.title);
            setAttr('meta[property="og:description"]', 'content', CATALOG.meta.description);
            setAttr('meta[name="description"]', 'content', CATALOG.meta.description);
            const siteTitle = document.getElementById('site-title');
            if (siteTitle && CATALOG.product && CATALOG.product.name) {
                siteTitle.textContent = CATALOG.product.name;
            }
        }

        async function loadCatalog() {
            if (!window.location.protocol.startsWith('http')) {
                return;
            }

            try {
                const endpoints = [
                    '/api/v1/catalog',
                    '/api/v1/properties',
                    '/api/v1/patterns',
                    '/api/v1/callouts',
                    '/api/v1/ad-slots',
                    '/api/v1/meta',
                    '/api/v1/shortcuts?os=mac',
                    '/api/v1/shortcuts?os=windows'
                ];
                const responses = await Promise.all(endpoints.map((url) => fetch(url)));

                if (responses.some((response) => !response.ok)) {
                    return;
                }

                const [catalogRes, propertiesRes, patternsRes, calloutsRes, adSlotsRes, metaRes, macShortcutsRes, windowsShortcutsRes] =
                    await Promise.all(responses.map((response) => response.json()));

                CATALOG = {
                    product: catalogRes.product ?? FALLBACK_CATALOG.product,
                    sections: catalogRes.sections ?? FALLBACK_CATALOG.sections,
                    properties: propertiesRes.items ?? FALLBACK_CATALOG.properties,
                    patterns: patternsRes.items ?? FALLBACK_CATALOG.patterns,
                    callouts: calloutsRes.items ?? FALLBACK_CATALOG.callouts,
                    adSlots: adSlotsRes.items ?? FALLBACK_CATALOG.adSlots,
                    meta: metaRes ?? FALLBACK_CATALOG.meta,
                    shortcuts: {
                        mac: macShortcutsRes ?? FALLBACK_CATALOG.shortcuts.mac,
                        windows: windowsShortcutsRes ?? FALLBACK_CATALOG.shortcuts.windows
                    }
                };
            } catch (_) {}
        }

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function setHighlightBase(el, text) {
            el.setAttribute('data-highlight-base', text);
            el.textContent = text;
        }

        function updateSearchHighlights(query) {
            document.querySelectorAll('[data-highlight-base]').forEach((el) => {
                const base = el.getAttribute('data-highlight-base') || '';
                if (!query) {
                    el.innerHTML = escapeHtml(base);
                    return;
                }

                const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${safeQuery})`, 'ig');
                el.innerHTML = escapeHtml(base).replace(regex, '<mark>$1</mark>');
            });
        }

        function initScrollSpy() {
            const options = {
                root: document.getElementById('main'),
                rootMargin: '-10% 0px -80% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                        });
                    }
                });
            }, options);

            document.querySelectorAll('section').forEach(section => {
                observer.observe(section);
            });
        }

        function createDemoElement(property, value) {
            const wrapper = document.createElement('div');
            wrapper.className = 'demo-wrapper';

            const container = document.createElement('div');
            container.className = 'demo-container';
            
            // Base layout
            let displayMode = property.layout === 'grid' ? 'grid' : 'flex';
            if (property.name === 'display') {
                displayMode = value;
            }
            container.style.display = displayMode;

            // Apply property
            if (property.level === 'container') {
                container.style[property.name] = value;
            }

            // Items
            const itemCount = property.id === 'grid-template-areas' ? 4 : 3;
            for (let i = 0; i < itemCount; i++) {
                const item = document.createElement('div');
                item.className = 'demo-item';
                
                // Specific logic for grid-template-areas
                if (property.id === 'grid-template-areas') {
                    const areas = ['header', 'sidebar', 'main', 'footer'];
                    item.style.gridArea = areas[i];
                    item.style.width = '100%';
                    item.style.height = '100%';
                }

                // Specific logic for z-index overlap
                if (property.id === 'z-index-grid') {
                    item.style.gridColumn = '1';
                    item.style.gridRow = '1';
                    if (i > 0) {
                        item.style.transform = `translate(${i * 12}px, ${i * 12}px)`;
                        item.style.opacity = '0.8';
                        // Give other items a middle-ground z-index to test layering
                        item.style.zIndex = '5';
                    }
                }

                if (property.level === 'item' && i === 0) {
                    item.style[property.name] = value;
                }
                container.appendChild(item);
            }

            // Tooltip
            const fullCss = `display: ${displayMode};\n${property.name}: ${value};`;
            container.setAttribute('data-tooltip', fullCss);

            wrapper.appendChild(container);
            
            const label = document.createElement('button');
            label.className = 'demo-label';
            setHighlightBase(label, value);
            label.title = "Click to copy";
            label.setAttribute('aria-label', `Copy CSS: ${property.name}: ${value};`);
            
            label.onclick = () => {
                copyToClipboard(`${property.name}: ${value};`, label, "Copied!", value);
            };

            wrapper.appendChild(label);

            return wrapper;
        }

        function initPatterns() {
            const grid = document.querySelector(`.card-grid[data-section="quick-patterns"]`);
            if (!grid) return;

            const styleTag = document.createElement('style');
            styleTag.id = 'pattern-styles';
            document.head.appendChild(styleTag);
            let allPatternStyles = '';

            CATALOG.patterns.forEach(pattern => {
                const card = document.createElement('div');
                card.className = 'property-card pattern-card';
                card.dataset.id = pattern.slug;

                const title = document.createElement('div');
                title.className = 'property-title';
                setHighlightBase(title, pattern.label);
                title.style.cursor = 'default';
                card.appendChild(title);

                // Demo Container
                const demoId = `pattern-demo-${pattern.slug}`;
                const demoContainer = document.createElement('div');
                demoContainer.className = 'demo-container';
                demoContainer.id = demoId;
                
                // Process CSS: replace root selector class with ID
                let patternCss = pattern.css;
                const firstClassMatch = patternCss.match(/\.[a-zA-Z0-9_-]+/);
                if (firstClassMatch) {
                    const rootClass = firstClassMatch[0];
                    const rootClassName = rootClass.substring(1);
                    const rootClassRegex = new RegExp('\\.' + rootClassName + '(?![a-zA-Z0-9_-])', 'g');
                    patternCss = patternCss.replace(rootClassRegex, '#' + demoId);
                }
                
                allPatternStyles += `\n/* ${pattern.label} */\n${patternCss}\n`;

                // Add items to demo with appropriate classes
                if (pattern.slug === 'sidebar-content-flex') {
                    const sidebar = document.createElement('div');
                    sidebar.className = 'demo-item sidebar';
                    demoContainer.appendChild(sidebar);
                    const content = document.createElement('div');
                    content.className = 'demo-item content';
                    demoContainer.appendChild(content);
                } else if (pattern.slug === 'holy-grail-layout') {
                    ['header', 'sidebar', 'main', 'footer'].forEach(area => {
                        const item = document.createElement('div');
                        item.className = 'demo-item';
                        item.style.gridArea = area;
                        item.style.width = '100%';
                        item.style.height = '100%';
                        demoContainer.appendChild(item);
                    });
                } else if (pattern.slug === 'equal-height-cards') {
                    for (let i = 0; i < 3; i++) {
                        const item = document.createElement('div');
                        item.className = 'demo-item card';
                        demoContainer.appendChild(item);
                    }
                } else {
                    const itemsCount = pattern.slug.includes('grid') || pattern.slug.includes('cards') ? 4 : 1;
                    for (let i = 0; i < itemsCount; i++) {
                        const item = document.createElement('div');
                        item.className = 'demo-item';
                        demoContainer.appendChild(item);
                    }
                }

                card.appendChild(demoContainer);

                // Copy Button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'property-title';
                copyBtn.style.marginTop = 'auto';
                copyBtn.style.width = '100%';
                copyBtn.style.textAlign = 'center';
                copyBtn.textContent = "Copy CSS Pattern";
                copyBtn.setAttribute('aria-label', `Copy CSS pattern for ${pattern.label}`);
                
                copyBtn.onclick = () => {
                    copyToClipboard(pattern.css, copyBtn, "Copied!", "Copy CSS Pattern");
                };
                
                card.appendChild(copyBtn);
                grid.appendChild(card);
            });
            
            styleTag.textContent = allPatternStyles;
        }

        function initCallouts() {
            CATALOG.callouts.forEach(callout => {
                const section = document.getElementById(callout.section);
                if (!section) return;

                const calloutEl = document.createElement('div');
                calloutEl.className = `callout-box callout-${callout.type}`;
                setHighlightBase(calloutEl, callout.text);
                
                if (callout.type === 'tip') calloutEl.setAttribute('role', 'note');
                if (callout.type === 'gotcha') calloutEl.setAttribute('role', 'alert');

                // Prepend after the h2
                const h2 = section.querySelector('h2');
                if (h2 && h2.nextSibling) {
                    section.insertBefore(calloutEl, h2.nextSibling);
                } else {
                    section.appendChild(calloutEl);
                }
            });
        }

        let activeFilter = 'all';
        let searchQuery = '';

        function debounce(fn, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        function initFilters() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    activeFilter = tab.dataset.filter;
                    applyFilters();
                });
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('search-input');
            const debouncedApply = debounce(() => applyFilters(), 150);
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                debouncedApply();
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchQuery = '';
                    applyFilters();
                    searchInput.blur();
                }
            });
        }

        function applyFilters() {
            const sections = document.querySelectorAll('section');
            
            if (!searchCache) {
                searchCache = new Map();
                CATALOG.properties.forEach(p => {
                    searchCache.set(p.id, (p.name + ' ' + p.values.join(' ') + ' ' + (p.note || '')).toLowerCase());
                });
                CATALOG.patterns.forEach(p => {
                    searchCache.set(p.slug, (p.label + ' ' + p.css).toLowerCase());
                });
            }

            sections.forEach(section => {
                const sectionData = CATALOG.sections.find(s => s.id === section.id);
                const sectionFilter = sectionData ? sectionData.filter : '';
                
                // 1. Filter section by tab
                let sectionVisibleByTab = (activeFilter === 'all' || activeFilter === sectionFilter);
                
                // 2. Filter cards within section by search
                const cards = section.querySelectorAll('.property-card');
                let visibleCardsInSection = 0;
                
                cards.forEach(card => {
                    const id = card.dataset.id;
                    const searchableText = searchCache.get(id) || '';
                    const matchesSearch = searchableText.includes(searchQuery);
                    
                    if (matchesSearch) {
                        card.style.display = 'flex';
                        visibleCardsInSection++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                
                // 3. Final section visibility
                if (sectionVisibleByTab && visibleCardsInSection > 0) {
                    section.style.display = 'block';
                    // Update sidebar link
                    const navLink = document.querySelector(`.nav-link[href="#${section.id}"]`);
                    if (navLink) navLink.style.display = 'block';
                } else {
                    section.style.display = 'none';
                    const navLink = document.querySelector(`.nav-link[href="#${section.id}"]`);
                    if (navLink) navLink.style.display = 'none';
                }
            });

            updateSearchHighlights(searchQuery);
        }

        function initDrawer() {
            const toggle = document.getElementById('menu-toggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            function toggleMenu() {
                const isOpen = sidebar.classList.toggle('open');
                overlay.classList.toggle('visible');
                document.body.classList.toggle('lock-scroll');
                toggle.setAttribute('aria-expanded', isOpen);
            }

            toggle.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);

            // Close when clicking nav links
            sidebar.addEventListener('click', (e) => {
                if (e.target.classList.contains('nav-link')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('visible');
                    document.body.classList.remove('lock-scroll');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function initAdSlots() {
            CATALOG.adSlots.forEach(slot => {
                const el = document.createElement('div');
                el.id = slot.id;
                el.className = 'ad-slot';
                el.textContent = `AD SLOT ${slot.size}`;
                
                const [width, height] = slot.size.split('x');
                el.style.minWidth = `${width}px`;
                el.style.minHeight = `${height}px`;

                if (slot.desktopOnly) el.dataset.desktopOnly = "true";
                if (slot.mobileOnly) el.dataset.mobileOnly = "true";

                // Placement logic
                if (slot.placement === 'header-between-search-and-tabs') {
                    const tabs = document.querySelector('.tabs-container');
                    if (tabs) tabs.parentNode.insertBefore(el, tabs);
                } else if (slot.placement === 'between-section-2-and-3') {
                    const section3 = document.getElementById(CATALOG.sections[2].id);
                    if (section3) section3.parentNode.insertBefore(el, section3);
                } else if (slot.placement === 'between-section-4-and-5') {
                    const section5 = document.getElementById(CATALOG.sections[4].id);
                    if (section5) section5.parentNode.insertBefore(el, section5);
                } else if (slot.placement === 'fixed-bottom-mobile') {
                    document.body.appendChild(el);
                }
            });
        }

        let currentOS = 'mac';

        function initShortcuts() {
            // Detect OS
            if (navigator.platform.toUpperCase().indexOf('WIN') !== -1) {
                currentOS = 'windows';
            } else if (navigator.platform.toUpperCase().indexOf('MAC') !== -1) {
                currentOS = 'mac';
            }

            const osButtons = document.querySelectorAll('.os-btn');
            osButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.os === currentOS);
                btn.addEventListener('click', () => {
                    currentOS = btn.dataset.os;
                    osButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateShortcuts();
                });
            });

            updateShortcuts();

            // Search shortcut listener
            window.addEventListener('keydown', (e) => {
                const isMac = currentOS === 'mac';
                const modifier = isMac ? e.metaKey : e.ctrlKey;
                
                if (modifier && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            });
        }

        function updateShortcuts() {
            const shortcuts = CATALOG.shortcuts[currentOS];
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.placeholder = `Search properties (${shortcuts.searchShortcut})...`;
                searchInput.title = `Search shortcut: ${shortcuts.searchShortcut}. Copy shortcut: ${shortcuts.copyShortcut}.`;
            }
        }

        function initPrint() {
            const printBtn = document.getElementById('print-btn');
            if (printBtn) {
                printBtn.addEventListener('click', () => {
                    window.print();
                });
            }
        }

        async function renderApp() {
            await loadCatalog();
            applyMetaFromCatalog();
            searchCache = null;
            initSidebar();
            initSections();
            initPropertyCards();
            initPatterns();
            initCallouts();
            initScrollSpy();
            initFilters();
            initSearch();
            initDrawer();
            initAdSlots();
            initShortcuts();
            initPrint();
            applyFilters();
        }

        // Initialize rendering
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
