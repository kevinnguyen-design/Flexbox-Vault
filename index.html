    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-color: #0d0d0d;
            --section-bg: #151515;
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --accent-color: #6366f1;
            --color-amber: #f59e0b;
            --color-emerald: #10b981;
            --color-red: #ef4444;
            --color-purple: #8b5cf6;
            --color-cyan: #06b6d4;
            --mono-color: #a5f3fc;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-areas: 
                "top-bar top-bar"
                "sidebar main";
            grid-template-rows: 60px 1fr;
            grid-template-columns: 280px 1fr;
        }

        #top-bar {
            grid-area: top-bar;
            background-color: var(--section-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 10;
        }

        #sidebar {
            grid-area: sidebar;
            background-color: var(--section-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1rem 0;
        }

        .nav-link {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            border-left-color: var(--accent-color);
        }

        #main {
            grid-area: main;
            background-color: var(--bg-color);
            overflow-y: auto;
            padding: 0 2rem 2rem 2rem;
        }

        section {
            padding-top: 2rem;
            margin-bottom: 2rem;
        }

        section h2 {
            position: sticky;
            top: 0;
            background-color: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            z-index: 5;
            font-size: 1.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* Basic dark theme scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>

        function renderApp() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main');

            CATALOG.sections.forEach(section => {
                // Sidebar link
                const link = document.createElement('a');
                link.href = `#${section.id}`;
                link.className = 'nav-link';
                link.textContent = section.title;
                sidebar.appendChild(link);

                // Main section
                const sectionEl = document.createElement('section');
                sectionEl.id = section.id;
                
                const h2 = document.createElement('h2');
                h2.textContent = section.title;
                sectionEl.appendChild(h2);

                const cardGrid = document.createElement('div');
                cardGrid.className = 'card-grid';
                // Add a data attribute for easier card injection in next tasks
                cardGrid.dataset.section = section.id;
                sectionEl.appendChild(cardGrid);

                main.appendChild(sectionEl);
            });

            // Basic scroll spy for active link (optional but nice)
            main.addEventListener('scroll', () => {
                let current = '';
                const sections = document.querySelectorAll('section');
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (main.scrollTop >= sectionTop - 100) {
                        current = section.getAttribute('id');
                    }
                });

                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href').substring(1) === current) {
                        link.classList.add('active');
                    }
                });
            });
        }

        // Initialize rendering
        document.addEventListener('DOMContentLoaded', renderApp);
