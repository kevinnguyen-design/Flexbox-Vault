        :root {
            --bg-color: #0d0d0d;
            --section-bg: #151515;
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --accent-color: #6366f1;
            --color-amber: #f59e0b;
            --color-emerald: #10b981;
            --color-red: #ef4444;
            --color-purple: #8b5cf6;
            --color-cyan: #06b6d4;
            --mono-color: #a5f3fc;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            
            --demo-indigo: #6366f1;
            --demo-amber: #f59e0b;
            --demo-emerald: #10b981;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-areas: 
                "top-bar top-bar"
                "sidebar main";
            grid-template-rows: 60px 1fr;
            grid-template-columns: 280px 1fr;
        }

        #top-bar {
            grid-area: top-bar;
            background-color: var(--section-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 10;
            gap: 2rem;
        }

        #top-bar h1 {
            font-size: 1.2rem;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        #search-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent-color);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .tabs-container {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: none;
        }

        .tab:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }

        #sidebar {
            grid-area: sidebar;
            background-color: var(--section-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 1rem 0;
        }

        .nav-link {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            border-left: 2px solid transparent;
        }

        .nav-link:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            border-left-color: var(--accent-color);
        }

        #main {
            grid-area: main;
            background-color: var(--bg-color);
            overflow-y: auto;
            padding: 0 2rem 2rem 2rem;
        }

        section {
            padding-top: 2rem;
            margin-bottom: 2rem;
        }

        section h2 {
            position: sticky;
            top: 0;
            background-color: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0 1rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            z-index: 5;
            font-size: 1.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .property-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .property-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            background-color: rgba(99, 102, 241, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            align-self: flex-start;
            transition: all 0.2s;
            border: none;
            outline: none;
        }

        .property-title:hover, .property-title:focus {
            background-color: rgba(99, 102, 241, 0.2);
            color: #fff;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .demo-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .demo-container {
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 100px;
            position: relative;
            overflow: hidden;
            padding: 8px;
            cursor: help;
        }

        .demo-item {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .demo-item:nth-child(1) { background-color: var(--demo-indigo); }
        .demo-item:nth-child(2) { background-color: var(--demo-amber); }
        .demo-item:nth-child(3) { background-color: var(--demo-emerald); }

        .demo-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background-color: #1e1e1e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            white-space: pre;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        [data-tooltip]:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        /* Basic dark theme scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

                sectionEl.id = section.id;
                
                const h2 = document.createElement('h2');
                h2.textContent = section.title;
                sectionEl.appendChild(h2);

                const cardGrid = document.createElement('div');
                cardGrid.className = 'card-grid';
                cardGrid.dataset.section = section.id;
                sectionEl.appendChild(cardGrid);

                fragment.appendChild(sectionEl);
            });

            main.appendChild(fragment);
        }

        function initScrollSpy() {
            const options = {
                root: document.getElementById('main'),
                rootMargin: '-10% 0px -80% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        document.querySelectorAll('.nav-link').forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                        });
                    }
                });
            }, options);

            document.querySelectorAll('section').forEach(section => {
                observer.observe(section);
            });
        }

        function createDemoElement(property, value) {
            const wrapper = document.createElement('div');
            wrapper.className = 'demo-wrapper';

            const container = document.createElement('div');
            container.className = 'demo-container';
            
            // Base layout
            let displayMode = property.layout === 'grid' ? 'grid' : 'flex';
            if (property.name === 'display') {
                displayMode = value;
            }
            container.style.display = displayMode;

            // Apply property
            if (property.level === 'container') {
                container.style[property.name] = value;
            }

            // Items
            const itemCount = property.id === 'grid-template-areas' ? 4 : 3;
            for (let i = 0; i < itemCount; i++) {
                const item = document.createElement('div');
                item.className = 'demo-item';
                
                // Specific logic for grid-template-areas
                if (property.id === 'grid-template-areas') {
                    const areas = ['header', 'sidebar', 'main', 'footer'];
                    item.style.gridArea = areas[i];
                    item.style.width = '100%';
                    item.style.height = '100%';
                }

                // Specific logic for z-index overlap
                if (property.id === 'z-index-grid') {
                    item.style.gridColumn = '1';
                    item.style.gridRow = '1';
                    if (i > 0) {
                        item.style.transform = `translate(${i * 12}px, ${i * 12}px)`;
                        item.style.opacity = '0.8';
                        // Give other items a middle-ground z-index to test layering
                        item.style.zIndex = '5';
                    }
                }

                if (property.level === 'item' && i === 0) {
                    item.style[property.name] = value;
                }
                container.appendChild(item);
            }

            // Tooltip
            const fullCss = `display: ${displayMode};\n${property.name}: ${value};`;
            container.setAttribute('data-tooltip', fullCss);

            wrapper.appendChild(container);
            
            const label = document.createElement('div');
            label.className = 'demo-label';
            label.textContent = value;
            label.style.cursor = 'pointer';
            label.title = "Click to copy";
            
            label.onclick = () => {
                const textToCopy = `${property.name}: ${value};`;
                navigator.clipboard.writeText(textToCopy);
                const originalText = value;
                label.textContent = "Copied!";
                setTimeout(() => label.textContent = originalText, 1000);
            };

            wrapper.appendChild(label);

            return wrapper;
        }

        function initPropertyCards() {
            const containers = {};
            CATALOG.sections.forEach(s => {
                containers[s.id] = document.querySelector(`.card-grid[data-section="${s.id}"]`);
            });

            CATALOG.properties.forEach(prop => {
                const grid = containers[prop.section];
                if (!grid) return;

                const card = document.createElement('div');
                card.className = 'property-card';
                card.dataset.id = prop.id;

                const title = document.createElement('button');
                title.className = 'property-title';
                title.textContent = prop.name;
                title.title = "Click to copy property name";
                title.setAttribute('aria-label', `Copy CSS property name: ${prop.name}`);
                
                const copyAction = () => {
                    navigator.clipboard.writeText(prop.name);
                    const originalText = prop.name;
                    title.textContent = "Copied!";
                    setTimeout(() => title.textContent = originalText, 1000);
                };
                
                title.onclick = copyAction;
                title.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        copyAction();
                    }
                };
                
                card.appendChild(title);

                const demoGrid = document.createElement('div');
                demoGrid.className = 'demo-grid';

                prop.values.forEach(val => {
                    demoGrid.appendChild(createDemoElement(prop, val));
                });

                card.appendChild(demoGrid);
                grid.appendChild(card);
            });
        }

        function initPatterns() {
            const grid = document.querySelector(`.card-grid[data-section="quick-patterns"]`);
            if (!grid) return;

            CATALOG.patterns.forEach(pattern => {
                const card = document.createElement('div');
                card.className = 'property-card pattern-card';
                card.dataset.id = pattern.slug;

                const title = document.createElement('div');
                title.className = 'property-title';
                title.textContent = pattern.label;
                title.style.cursor = 'default';
                title.style.pointerEvents = 'none';
                card.appendChild(title);

                const code = document.createElement('div');
                code.className = 'demo-label';
                code.style.textAlign = 'left';
                code.style.marginTop = '0.5rem';
                code.style.cursor = 'pointer';
                code.textContent = pattern.css;
                
                code.onclick = () => {
                    navigator.clipboard.writeText(pattern.css);
                    const originalText = pattern.css;
                    code.textContent = "Copied!";
                    setTimeout(() => code.textContent = originalText, 1000);
                };

                card.appendChild(code);
                grid.appendChild(card);
            });
        }

        let activeFilter = 'all';
        let searchQuery = '';

        function debounce(fn, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        function initFilters() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    activeFilter = tab.dataset.filter;
                    applyFilters();
                });
            });
        }

        function initSearch() {
            const searchInput = document.getElementById('search-input');
            const debouncedApply = debounce(() => applyFilters(), 150);
            
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                debouncedApply();
            });
        }

        function applyFilters() {
            const sections = document.querySelectorAll('section');
            
            // Create searchable cache if it doesn't exist
            if (!window._searchCache) {
                window._searchCache = new Map();
                CATALOG.properties.forEach(p => {
                    window._searchCache.set(p.id, (p.name + ' ' + p.values.join(' ')).toLowerCase());
                });
                CATALOG.patterns.forEach(p => {
                    window._searchCache.set(p.slug, (p.label + ' ' + p.css).toLowerCase());
                });
            }

            sections.forEach(section => {
                const sectionData = CATALOG.sections.find(s => s.id === section.id);
                const sectionFilter = sectionData ? sectionData.filter : '';
                
                // 1. Filter section by tab
                let sectionVisibleByTab = (activeFilter === 'all' || activeFilter === sectionFilter);
                
                // 2. Filter cards within section by search
                const cards = section.querySelectorAll('.property-card');
                let visibleCardsInSection = 0;
                
                cards.forEach(card => {
                    const id = card.dataset.id;
                    const searchableText = window._searchCache.get(id) || '';
                    const matchesSearch = searchableText.includes(searchQuery);
                    
                    if (matchesSearch) {
                        card.style.display = 'flex';
                        visibleCardsInSection++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                
                // 3. Final section visibility
                if (sectionVisibleByTab && visibleCardsInSection > 0) {
                    section.style.display = 'block';
                    // Update sidebar link
                    const navLink = document.querySelector(`.nav-link[href="#${section.id}"]`);
                    if (navLink) navLink.style.display = 'block';
                } else {
                    section.style.display = 'none';
                    const navLink = document.querySelector(`.nav-link[href="#${section.id}"]`);
                    if (navLink) navLink.style.display = 'none';
                }
            });
        }

        function renderApp() {
            initSidebar();
            initSections();
            initPropertyCards();
            initPatterns();
            initScrollSpy();
            initFilters();
            initSearch();
            applyFilters();
        }

        // Initialize rendering
        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
